databases:
  - name: site-marketing-db
    plan: free
    databaseName: site_marketing
    user: site_marketing

services:
  - type: web
    name: site-marketing
    runtime: python
    plan: free
    buildCommand: 'bash build.sh'
    startCommand: 'gunicorn site_marketing.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 120'
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: site-marketing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: WEB_CONCURRENCY
        value: '2'
      - key: SECURE_SSL_REDIRECT
        value: 'True'
      - key: SESSION_COOKIE_SECURE
        value: 'True'
      - key: CSRF_COOKIE_SECURE
        value: 'True'
      - key: SECURE_HSTS_SECONDS
        value: '31536000'
      - key: CLOUDINARY_URL
        sync: false
